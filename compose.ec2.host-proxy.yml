name: knot-prototype-ec2

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 256m
    logging: &bounded-logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    environment:
      POSTGRES_DB: knot_prototype
      POSTGRES_USER: knot_migrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - knot-prototype-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U knot_migrator -d knot_prototype']
      interval: 10s
      timeout: 5s
      retries: 20

  migrate:
    image: ${KNOT_API_IMAGE:?set KNOT_API_IMAGE}
    platform: linux/arm64
    restart: 'no'
    mem_limit: 384m
    logging: *bounded-logging
    depends_on:
      postgres:
        condition: service_healthy
    command: ['corepack', 'pnpm', '--filter', '@meeting-stt/api', 'run', 'db:migrate']
    environment:
      APP_ENV: production
      API_HOST: 0.0.0.0
      PORT: 4310
      STORAGE_DRIVER: ${STORAGE_DRIVER:?set STORAGE_DRIVER}
      AWS_REGION: ${AWS_REGION:?set AWS_REGION}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      S3_PREFIX: ${S3_PREFIX:?set S3_PREFIX}
      S3_PRIVATE_PREFIX_CONFIRMED: ${S3_PRIVATE_PREFIX_CONFIRMED:?set S3_PRIVATE_PREFIX_CONFIRMED}
      S3_PUBLIC_READ_ACKNOWLEDGED: ${S3_PUBLIC_READ_ACKNOWLEDGED:-false}
      AUTH_MODE: github
      DATABASE_URL: postgres://knot_migrator:${POSTGRES_PASSWORD}@postgres:5432/knot_prototype
      MIGRATION_DATABASE_URL: postgres://knot_migrator:${POSTGRES_PASSWORD}@postgres:5432/knot_prototype
      API_RUNTIME_DB_USER: knot_api_runtime
      API_RUNTIME_DB_PASSWORD: ${API_RUNTIME_DB_PASSWORD:?set API_RUNTIME_DB_PASSWORD}
      OAUTH_CALLBACK_URL: https://${KNOT_API_DOMAIN:?set KNOT_API_DOMAIN}/v1/auth/github/callback
      DESKTOP_SCHEME: knot-prototype
      JSON_BODY_LIMIT_BYTES: ${JSON_BODY_LIMIT_BYTES:-33554432}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2147483648}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?set GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?set GITHUB_CLIENT_SECRET}

  api:
    image: ${KNOT_API_IMAGE:?set KNOT_API_IMAGE}
    platform: linux/arm64
    restart: unless-stopped
    mem_limit: 384m
    logging: *bounded-logging
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ['corepack', 'pnpm', '--filter', '@meeting-stt/api', 'run', 'start']
    environment:
      APP_ENV: production
      API_HOST: 0.0.0.0
      PORT: 4310
      STORAGE_DRIVER: ${STORAGE_DRIVER:?set STORAGE_DRIVER}
      AWS_REGION: ${AWS_REGION:?set AWS_REGION}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      S3_PREFIX: ${S3_PREFIX:?set S3_PREFIX}
      S3_PRIVATE_PREFIX_CONFIRMED: ${S3_PRIVATE_PREFIX_CONFIRMED:?set S3_PRIVATE_PREFIX_CONFIRMED}
      S3_PUBLIC_READ_ACKNOWLEDGED: ${S3_PUBLIC_READ_ACKNOWLEDGED:-false}
      AUTH_MODE: github
      DATABASE_URL: postgres://knot_api_runtime:${API_RUNTIME_DB_PASSWORD}@postgres:5432/knot_prototype
      OAUTH_CALLBACK_URL: https://${KNOT_API_DOMAIN:?set KNOT_API_DOMAIN}/v1/auth/github/callback
      DESKTOP_SCHEME: knot-prototype
      JSON_BODY_LIMIT_BYTES: ${JSON_BODY_LIMIT_BYTES:-33554432}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2147483648}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?set GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?set GITHUB_CLIENT_SECRET}
    ports:
      - '127.0.0.1:4310:4310'
    volumes:
      - knot-prototype-upload-spool:/app/var/prototype-storage
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:4310/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"'
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  knot-prototype-pg:
  knot-prototype-upload-spool:
